# RaTTY defaults. Do not edit: this file is compiled into the binary.
# Copy what you want into ~/.config/ratty/config.yaml, which is an overlay.
# Why each default is what it is: doc/default-config.md

font:
  # Tried in order; the first family actually installed wins. If none are,
  # the system's monospaced default is used.
  family:
    - DroidSansMono Nerd Font
    - DroidSansM Nerd Font
    - Droid Sans Mono Nerd Font
    - DroidSansMono NF
    - Droid Sans Mono for Powerline
  # Extra families for code points the primary font lacks.
  fallback: []
  size: 13                    # 6 - 72
  # Emoji height as a multiple of a capital letter's. Above 1.0 because a round
  # shape has to be drawn larger than a flat one to look the same size.
  emoji_scale: 1.25           # 0.3 - 1.5

cursor:
  style: bar                  # block | hollow | underline | bar
  blink: true

# ratty-dark | ratty-light | dracula | nord | tokyo-night | one-dark
# catppuccin-mocha | gruvbox-dark | gruvbox-light | solarized-dark | solarized-light
theme: ratty-dark

# Overrides the theme. Accepts background, foreground, cursor,
# selection_background, and the 16 ANSI names (red, bright_red, ...).
# Hex values must be quoted: "#1e1e1e"
colors: {}

tab_bar:
  style: powerline            # minimal | underline | blocks | pills | powerline
  position: bottom            # top | bottom
  show: multiple              # always | multiple | never
  # background, border, active_background, active_foreground,
  # inactive_foreground, accent. Unset values are derived from the palette.
  colors: {}

scrollback:
  lines: 10000                # 0 disables the scrollback
  multiplier: 3               # rows per wheel notch, 1 - 100

mouse:
  alternate_scroll: true

splits:
  # separator: unset derives it from the theme's accent colour
  dim_unfocused: true
  dim_strength: 0.35          # 0.0 - 0.9

directories:
  new_tab: home               # home | cwd | a path such as ~/work
  new_split: cwd              # cwd follows the pane it was opened from

window:
  width: 1280
  height: 720
  padding: 4                  # logical pixels, 0 - 200
  opacity: 1.0                # 0.1 - 1.0
  fullscreen: false

# auto follows the platform; true forces the macOS set, false the Linux set.
mac_os_bindings: auto         # auto | true | false
