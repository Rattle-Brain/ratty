# RaTTY default configuration
#
# This file ships inside the binary. To change anything, copy the settings you
# care about into ~/.config/ratty/config.yaml -- that file is an *overlay*, so it
# only needs the keys you want to change, and everything else keeps the defaults
# below.
#
# One YAML gotcha worth knowing: '#' starts a comment, so hex colours must be
# quoted.
#     background: "#1e1e1e"     <- correct
#     background: #1e1e1e       <- an empty value and a comment

font:
  # Families are tried in order; the first one actually installed wins. If none
  # are, RaTTY uses whatever font the system has set as its monospaced default.
  family:
    - DroidSansMono Nerd Font
    - DroidSansM Nerd Font
    - Droid Sans Mono Nerd Font
    - DroidSansMono NF
    - Droid Sans Mono for Powerline

  # Consulted for characters the main font does not have. Left empty, RaTTY
  # already falls back to the system monospaced font and to any installed colour
  # emoji font, so this is only needed to force a specific choice.
  fallback: []

  size: 13

cursor:
  # block | hollow | underline | bar
  # An application's own request (DECSCUSR) takes precedence while it applies.
  style: bar
  blink: true

# The colour scheme. One of the themes that ship with RaTTY:
#
#   ratty-dark          catppuccin-mocha    nord
#   dracula             one-dark            tokyo-night
#   gruvbox-dark        gruvbox-light
#   solarized-dark      solarized-light
#
theme: ratty-dark

# Anything under `colors:` overrides the theme, so you can take a scheme and
# change one thing. Order does not matter: the theme is always applied first.
#
#   theme: nord
#   colors:
#     red: "#ff0000"
#
# `cursor` left unset follows the foreground, so a theme that inverts the
# terminal does not leave the cursor invisible.
colors: {}
#   background:           "#1e1e1e"
#   foreground:           "#dcdcdc"
#   cursor:               "#dcdcdc"
#   selection_background: "#6495ed80"
#   black:   "#000000"    bright_black:   "#666666"
#   red:     "#cd3131"    bright_red:     "#f14c4c"
#   green:   "#0dbc79"    bright_green:   "#23d18b"
#   yellow:  "#e5e510"    bright_yellow:  "#f5f543"
#   blue:    "#2472c8"    bright_blue:    "#3b8eea"
#   magenta: "#bc3fbc"    bright_magenta: "#d670d6"
#   cyan:    "#11a8cd"    bright_cyan:    "#29b8db"
#   white:   "#e5e5e5"    bright_white:   "#ffffff"

tab_bar:
  # minimal   text only, with a short accent along the edge facing the terminal
  # underline a full-width accent rule and a faint wash behind the active tab
  # blocks    the active tab is a filled rectangle, tabs divided by hairlines
  # pills     the active tab is a filled rounded capsule
  # powerline angled chevrons, echoing a Powerline prompt
  style: powerline

  # bottom | top
  position: bottom

  # always | multiple | never
  #   multiple hides the bar until a second tab exists, so a single-terminal
  #   window looks like a terminal rather than a tabbed document.
  show: multiple

  # Every colour here is optional. Left out, it is derived from the terminal
  # palette above, so a colour theme does not have to restate the chrome.
  colors: {}
  #   background:          "#252525"
  #   border:              "#3a3a3a"
  #   active_background:   "#1e1e1e"
  #   active_foreground:   "#dcdcdc"
  #   inactive_foreground: "#8a8a8a"
  #   accent:              "#3b8eea"

window:
  width: 1280
  height: 720
  # Gap in logical pixels between the text and the window edge.
  padding: 4
  opacity: 1.0
  fullscreen: false

# Which set of default keybindings to load.
#
#   auto   follow the platform: the macOS set on macOS, the Linux set elsewhere
#   true   force the macOS set  (a Mac keyboard on a Linux machine, say)
#   false  force the Linux set
#
# The two sets are the same bindings written two ways: the macOS file says `cmd`
# and the Linux file says `super`, because that is what a reader of each platform
# expects. Qt maps both to the same modifier, so they behave identically.
#
#   macOS:  resources/keybindings/macos.yaml
#   Linux:  resources/keybindings/linux.yaml
#
# To change a binding, add a `keybindings:` section to
# ~/.config/ratty/config.yaml. Naming an action there replaces every key the
# defaults gave it; set an action to `none` to remove it.
#
#   keybindings:
#     ctrl+shift+t: split_vertical   # move it off ctrl+shift+w
#     ctrl+shift+w: none             # and drop the old key
mac_os_bindings: auto
