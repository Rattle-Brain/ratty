# RaTTY's own dark theme, and the default.
#
# Inspired by Nord, but pushed toward charcoal rather than blue-grey:
# near-black surfaces, restrained steel-blue accents, muted earthy colours,
# and a teal cursor that remains distinct without becoming the dominant colour.

name: RaTTY Dark
colors:
  background:           "#101417"
  foreground:           "#d5dadd"
  cursor:               "#3f9588"
  selection_background: "#293238"

  black:          "#171c1f"
  red:            "#b85b63"
  green:          "#789b8f"
  yellow:         "#c5a45b"
  blue:           "#4f6f91"
  magenta:        "#876d83"
  cyan:           "#5f8994"
  white:          "#d9dddf"

  bright_black:   "#353d42"
  bright_red:     "#cb6c70"
  bright_green:   "#8eae8b"
  bright_yellow:  "#d2b36a"
  bright_blue:    "#6586aa"
  bright_magenta: "#9a7d94"
  bright_cyan:    "#73a2ad"
  bright_white:   "#e7eaeb"

tab_bar:
  colors:
    background:          "#0a0d0f"
    border:              "#252d32"
    active_background:   "#59656d"
    active_foreground:   "#080a0b"
    inactive_foreground: "#68747b"
    accent:              "#4f6f91"
